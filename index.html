// ===== PAGINATION =====
function renderPagination(total,page,pageSize,onPage){
var tp=Math.ceil(total/pageSize);
if(tp<=1)return'';
var h='<div class="pgnt">';
h+='<button '+(page<=1?'disabled':'')+' onclick="'+onPage+'('+(page-1)+')">&lt;</button>';
for(var i=1;i<=tp;i++){
if(i===1||i===tp||(i>=page-2&&i<=page+2)){
h+='<button class="'+(i===page?'ac':'')+'" onclick="'+onPage+'('+i+')">'+i+'</button>';
}else if(i===page-3||i===page+3){
h+='<button disabled>...</button>';
}
}
h+='<button '+(page>=tp?'disabled':'')+' onclick="'+onPage+'('+(page+1)+')">&gt;</button>';
h+='</div>';
return h;
}

function refreshTaskTable(){
var ts=DTasks;
if(taskSearch){ts=ts.filter(function(x){return x.name.indexOf(taskSearch)>=0;});}
if(taskStatusFilter){ts=ts.filter(function(x){return x.status===taskStatusFilter;});}
var pageSize=8,tp=Math.ceil(ts.length/pageSize);
if(taskPage>tp)taskPage=tp;
if(taskPage<1)taskPage=1;
var start=(taskPage-1)*pageSize,pg=ts.slice(start,start+pageSize);
var statusLabel={running:'运行中',paused:'已暂停',completed:'已完成',pending:'待启动'};
var statusBadge={running:'su',paused:'wa',completed:'gr',pending:'in'};
var fillCls={running:'bl',paused:'or',completed:'gr',pending:'gr'};
var h='';
pg.forEach(function(t){
h+='<tr><td>'+t.id+'</td><td><strong>'+t.name+'</strong></td><td>'+t.script+'</td><td>'+t.total+'</td><td>'+t.called+'</td>'+

'<td><div class="pb"><div class="fill '+fillCls[t.status]+'" style="width:'+t.progress+'%"></div></div><span style="font-size:10px;margin-left:4px">'+t.progress+'%</span></td>'+
'<td>'+t.createTime+'</td>'+
'<td class="ta">'+
(t.status==='running'?'<button class="btn btn-sm btn-w" onclick="pauseTask('+t.id+')">⏸ 暂停</button>':'')+
(t.status==='paused'?'<button class="btn btn-sm btn-s" onclick="startTask('+t.id+')">▶ 启动</button>':'')+
'<button class="btn btn-sm btn-o" onclick="editTask('+t.id+')">✏️</button>'+

});
document.getElementById('taskTbody').innerHTML=h||'<tr><td colspan="9" class="em"><div class="eic">📭</div><p>暂无匹配的任务</p></td></tr>';
document.getElementById('taskPgn').innerHTML=renderPagination(ts.length,taskPage,pageSize,'goTaskPage');
}

function startTask(id){
var t=DTasks.find(function(x){return x.id===id;});
if(t){t.status='running';setStored('tx_tasks',DTasks);toast('任务"'+t.name+'"已启动','su');refreshTaskTable();}
}
function deleteTask(id){
var t=DTasks.find(function(x){return x.id===id;});
if(confirm('确定删除任务"'+t.name+'"吗？')){
DTasks=DTasks.filter(function(x){return x.id!==id;});
setStored('tx_tasks',DTasks);toast('任务已删除','da');refreshTaskTable();
}
}
function editTask(id){showTaskModal(id);}
function showTaskModal(id){
var t=null;if(id){t=DTasks.find(function(x){return x.id===id;});}
var body='<div class="fr fl"><label>任务名称</label><input id="tmName" value="'+(t?t.name:'')+'"></div>'+
'<div class="fr"><label>话术模板</label><select id="tmScript">'+DScripts.map(function(s){return '<option value="'+s.name+'"'+(t&&t.script===s.name?' selected':'')+'>'+s.name+'</option>';}).join('')+'</select>'+
'<label>号码数量</label><input id="tmTotal" type="number" value="'+(t?t.total:'200')+'"></div>'+
'<div class="fr fl"><label>创建人</label><input id="tmCreator" value="'+(t?t.creator:CUR.n)+'"></div>';
var footer='<button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="saveTask('+(id||0)+')">保存</button>';
openModal(t?'编辑任务':'新建任务',body,footer);
}
function saveTask(id){
var nm=document.getElementById('tmName').value.trim();
var sc=document.getElementById('tmScript').value;
var tot=parseInt(document.getElementById('tmTotal').value)||200;
var cr=document.getElementById('tmCreator').value.trim();
if(!nm){toast('请输入任务名称','er');return;}
if(id){
var t=DTasks.find(function(x){return x.id===id;});
if(t){t.name=nm;t.script=sc;t.total=tot;t.creator=cr;}
toast('任务已更新','su');
}else{
var nid=DTasks.length>0?Math.max.apply(null,DTasks.map(function(x){return x.id;}))+1:1;
DTasks.push({id:nid,name:nm,script:sc,total:tot,called:0,status:'pending',progress:0,createTime:new Date().toISOString().slice(0,10),creator:cr});
toast('任务已创建','su');
}
setStored('tx_tasks',DTasks);
closeModal();refreshTaskTable();
}

'<div id="numPgn"></div></div>';

var numSel=[];
function refreshNumTable(){
var ns=DNums;
if(numSearch){ns=ns.filter(function(x){return x.num.indexOf(numSearch)>=0;});}
if(numStatusFilter){ns=ns.filter(function(x){return x.status===numStatusFilter;});}
var ps=8,tp=Math.ceil(ns.length/ps);
if(numPage>tp)numPage=tp;if(numPage<1)numPage=1;
var st=(numPage-1)*ps,pg=ns.slice(st,st+ps);
var stBadge={待呼叫:'wa',已呼叫:'in',呼叫中:'bl',已完成:'su'};
var h='';
pg.forEach(function(n){
h+='<tr><td><input type="checkbox" '+(numSel.indexOf(n.id)>=0?'checked':'')+' onchange="toggleNumSel('+n.id+',this)"></td>'+
'<td>'+n.id+'</td><td><strong>'+n.num+'</strong></td><td>'+n.city+'</td>'+
'<td><span class="bdge '+stBadge[n.status]+'">'+n.status+'</span></td><td>'+n.tag+'</td><td>'+n.source+'</td>'+
'<td>'+n.callTimes+'</td><td>'+n.lastCall+'</td>'+
'<td class="ta"><button class="btn btn-sm btn-o" onclick="editNum('+n.id+')">✏️</button>'+
'<button class="btn btn-sm btn-d" onclick="delNum('+n.id+')">🗑</button>'+
'<button class="btn btn-sm btn-w" onclick="blacklistNum('+n.id+')">🚫</button></td></tr>';
});
document.getElementById('numTbody').innerHTML=h||'<tr><td colspan="10" class="em"><div class="eic">📭</div><p>暂无号码</p></td></tr>';
document.getElementById('numPgn').innerHTML=renderPagination(ns.length,numPage,ps,'goNumPage');
}
function numSearchFn(v){numSearch=v;numPage=1;refreshNumTable();}
function numStatusFn(v){numStatusFilter=v;numPage=1;refreshNumTable();}
function goNumPage(p){numPage=p;refreshNumTable();}
function toggleNumSel(id,el){if(el.checked){numSel.push(id);}else{numSel=numSel.filter(function(x){return x!==id;});}}
function toggleAllNums(el){
var ns=DNums;if(numSearch)ns=ns.filter(function(x){return x.num.indexOf(numSearch)>=0;});
if(numStatusFilter)ns=ns.filter(function(x){return x.status===numStatusFilter;});
var ps=8,st=(numPage-1)*ps,pg=ns.slice(st,st+ps);
if(el.checked){pg.forEach(function(n){if(numSel.indexOf(n.id)<0)numSel.push(n.id);});}
else{pg.forEach(function(n){numSel=numSel.filter(function(x){return x!==n.id;});});}
refreshNumTable();
}
function batchDelNums(){
if(numSel.length===0){toast('请先选择号码','er');return;}
if(confirm('确定删除选中的'+numSel.length+'个号码？')){
DNums=DNums.filter(function(n){return numSel.indexOf(n.id)<0;});
numSel=[];setStored('tx_nums',DNums);toast('已删除','da');refreshNumTable();
}
}
function delNum(id){
if(confirm('确定删除此号码？')){
DNums=DNums.filter(function(n){return n.id!==id;});
numSel=numSel.filter(function(x){return x!==id;});
setStored('tx_nums',DNums);toast('号码已删除','da');refreshNumTable();
}
}
function blacklistNum(id){
var n=DNums.find(function(x){return x.id===id;});
if(n){n.tag='黑名单';n.status='已完成';setStored('tx_nums',DNums);toast('已加入黑名单','wa');refreshNumTable();}
}
function editNum(id){
var n=DNums.find(function(x){return x.id===id;});
if(!n)return;
var body='<div class="fr"><label>号码</label><input id="enNum" value="'+n.num+'"></div>'+
'<div class="fr"><label>归属地</label><input id="enCity" value="'+n.city+'"></div>'+
'<div class="fr"><label>标签</label><input id="enTag" value="'+n.tag+'"></div>'+
'<div class="fr"><label>状态</label><select id="enStatus"><option value="待呼叫"'+(n.status==='待呼叫'?' selected':'')+'>待呼叫</option><option value="已呼叫"'+(n.status==='已呼叫'?' selected':'')+'>已呼叫</option><option value="呼叫中"'+(n.status==='呼叫中'?' selected':'')+'>呼叫中</option><option value="已完成"'+(n.status==='已完成'?' selected':'')+'>已完成</option></select></div>';
var footer='<button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="saveNumEdit('+id+')">保存</button>';
openModal('编辑号码 - ID:'+id,body,footer);
}
function saveNumEdit(id){
var n=DNums.find(function(x){return x.id===id;});
if(!n)return;
n.num=document.getElementById('enNum').value.trim();
n.city=document.getElementById('enCity').value.trim();
n.tag=document.getElementById('enTag').value.trim();
n.status=document.getElementById('enStatus').value;

function refreshCallTable(){
var cs=DCalls;
if(callSearch){cs=cs.filter(function(x){return x.customer.indexOf(callSearch)>=0||x.num.indexOf(callSearch)>=0;});}
if(callResultFilter){cs=cs.filter(function(x){return x.result===callResultFilter;});}
if(callIntentFilter){cs=cs.filter(function(x){return x.intent===callIntentFilter;});}
var ps=8,tp=Math.ceil(cs.length/ps);
if(callPage>tp)callPage=tp;if(callPage<1)callPage=1;
var st=(callPage-1)*ps,pg=cs.slice(st,st+ps);
var rBadge={已接通:'su',未接通:'wa',拒接:'da',关机:'gr',空号:'gr',正在通话中:'in',用户挂断:'wa'};
var iBadge={高意向:'su',中等意向:'wa',低意向:'in',无意向:'gr',需跟进:'bl',已成交:'pu'};
var h='';
pg.forEach(function(c){
h+='<tr><td>'+c.id+'</td><td>'+c.customer+'</td><td>'+c.num+'</td><td><span class="bdge '+(rBadge[c.result]||'gr')+'">'+c.result+'</span></td>'+
'<td>'+c.duration+'</td><td><span class="bdge '+(iBadge[c.intent]||'gr')+'">'+c.intent+'</span></td>'+
'<td>'+c.script+'</td><td>'+c.agent+'</td><td>'+c.time+'</td></tr>';
});
document.getElementById('callTbody').innerHTML=h||'<tr><td colspan="9" class="em"><div class="eic">📭</div><p>暂无记录</p></td></tr>';
document.getElementById('callPgn').innerHTML=renderPagination(cs.length,callPage,ps,'goCallPage');
}
function callSearchFn(v){callSearch=v;callPage=1;refreshCallTable();}
function callResultFn(v){callResultFilter=v;callPage=1;refreshCallTable();}
function callIntentFn(v){callIntentFilter=v;callPage=1;refreshCallTable();}
function goCallPage(p){callPage=p;refreshCallTable();}

function refreshLeadTable(){
var ls=DLeads;
if(leadSearch){ls=ls.filter(function(x){return x.customer.indexOf(leadSearch)>=0||x.company.indexOf(leadSearch)>=0;});}
if(leadStageFilter){ls=ls.filter(function(x){return x.stage===leadStageFilter;});}
var ps=8,tp=Math.ceil(ls.length/ps);
if(leadPage>tp)leadPage=tp;if(leadPage<1)leadPage=1;
var st=(leadPage-1)*ps,pg=ls.slice(st,st+ps);
var stageBadge={初步接触:'in',需求确认:'wa',方案报价:'bl',商务谈判:'pu',签约:'su',已成交:'su',已流失:'da'};
var intentBadge={极高:'su',高:'su',中:'wa',低:'in'};
var h='';
pg.forEach(function(l){
h+='<tr><td><input type="checkbox"></td><td>'+l.id+'</td><td><strong>'+l.customer+'</strong></td><td>'+l.company+'</td><td>'+l.phone+'</td>'+
'<td><span class="bdge '+(stageBadge[l.stage]||'gr')+'">'+l.stage+'</span></td>'+
'<td>'+l.source+'</td><td>'+l.owner+'</td>'+
'<td><span class="bdge '+(intentBadge[l.intent]||'gr')+'">'+l.intent+'</span></td>'+
'<td>'+l.budget+'</td><td>'+l.time+'</td>'+
'<td class="ta"><button class="btn btn-sm btn-s" onclick="claimLead('+l.id+')">📥 领取</button>'+
'<button class="btn btn-sm btn-o" onclick="assignLead('+l.id+')">📤 分配</button>'+
'<button class="btn btn-sm btn-o" onclick="editLead('+l.id+')">✏️</button>'+
'<button class="btn btn-sm btn-d" onclick="delLead('+l.id+')">🗑</button></td></tr>';
});
document.getElementById('leadTbody').innerHTML=h||'<tr><td colspan="12" class="em"><div class="eic">📭</div><p>暂无线索</p></td></tr>';
document.getElementById('leadPgn').innerHTML=renderPagination(ls.length,leadPage,ps,'goLeadPage');
}

var titles=['系统登录异常排查','话术识别准确率下降','客户反映通话中断','API接口对接咨询','坐席无法拨号','外呼号码被标记骚扰','数据分析报表定制','知识库同步失败','发票信息有误','增值功能开通申请','呼叫中心部署咨询','计费异常申诉'];
var cats=['故障报修','服务请求','咨询建议','投诉处理','运维支持','功能开通'];
var prios=['高','中','低'];
var statuses=['待处理','处理中','已解决','已关闭'];
var ags=['张明','李娟','王磊','赵丽','陈晨'];
for(var i=0;i<12;i++){
var st=statuses[i%4];
var create=new Date(2026,5,1+Math.floor(i*2.4));
var sla=24+Math.floor(Math.random()*48);
var solved=st==='已解决'||st==='已关闭'?create.getTime()+sla*3600000:null;
var closed=st==='已关闭'?(solved?solved+Math.random()*3600000:null):null;
var used=Math.floor(Math.random()*sla);
DTickets.push({
id:'TK'+String(1001+i),title:titles[i],cat:cats[Math.floor(Math.random()*cats.length)],
prio:prios[Math.floor(Math.random()*3)],status:st,
reporter:'客户'+(i+1),assignee:ags[Math.floor(Math.random()*ags.length)],
createTime:create.toISOString().slice(0,10),sla:sla+'h',usedTime:used+'h',
desc:'用户反馈：'+titles[i]+'。需要尽快处理并反馈处理结果，涉及客户体验与服务质量。',
comments:[{author:ags[Math.floor(Math.random()*ags.length)],text:'已收到工单，正在排查处理中',time:create.toISOString().slice(0,10)}]
});
}
})();

var tkPage=1,tkSearchV='',tkStatusV='',tkPrioV='';
function refreshTicketList(){
var ls=DTickets;
if(tkSearchV){ls=ls.filter(function(x){return x.title.indexOf(tkSearchV)>=0||x.id.indexOf(tkSearchV)>=0;});}
if(tkStatusV){ls=ls.filter(function(x){return x.status===tkStatusV;});}
if(tkPrioV){ls=ls.filter(function(x){return x.prio===tkPrioV;});}
var ps=8,tp=Math.ceil(ls.length/ps);
if(tkPage>tp)tkPage=tp;if(tkPage<1)tkPage=1;
var st=(tkPage-1)*ps,pg=ls.slice(st,st+ps);
var sBadge={待处理:'or',处理中:'bl',已解决:'su',已关闭:'gr'};
var pBadge={高:'da',中:'wa',低:'in'};
var h='';
pg.forEach(function(t){
h+='<tr><td><strong>'+t.id+'</strong></td><td style="max-width:160px">'+t.title+'</td><td><span class="bdge pu">'+t.cat+'</span></td><td><span class="bdge '+(pBadge[t.prio]||'in')+'">'+t.prio+'</span></td><td><span class="bdge '+(sBadge[t.status]||'gr')+'">'+t.status+'</span></td><td>'+t.reporter+'</td><td>'+t.assignee+'</td><td style="font-size:10px">'+t.sla+'<br><span style="color:var(--tm)">已用'+t.usedTime+'</span></td><td>'+t.createTime+'</td>'+
'<td class="ta"><button class="btn btn-sm btn-o" onclick="openTicketDetail(\''+t.id+'\')">👁 详情</button>'+
(t.status==='待处理'?'<button class="btn btn-sm btn-p" onclick="tkNext(\''+t.id+'\')">▶ 开始处理</button>':'')+
(t.status==='处理中'?'<button class="btn btn-sm btn-s" onclick="tkNext(\''+t.id+'\')">✅ 标记解决</button>':'')+
(t.status==='已解决'?'<button class="btn btn-sm btn-o" onclick="tkNext(\''+t.id+'\')">📁 关闭</button>':'')+
'</td></tr>';
});
document.getElementById('tkTbody').innerHTML=h||'<tr><td colspan="11" class="em"><div class="eic">📭</div><p>暂无工单</p></td></tr>';
document.getElementById('tkPgn').innerHTML=renderPagination(ls.length,tkPage,ps,'goTKPage');
}
function goTKPage(p){tkPage=p;refreshTicketList();}
function tkSearch(v){tkSearchV=v;tkPage=1;refreshTicketList();}
function tkStatusFilter(v){tkStatusV=v;tkPage=1;refreshTicketList();}
function tkPrioFilter(v){tkPrioV=v;tkPage=1;refreshTicketList();}
function tkNext(id){
var t=DTickets.find(function(x){return x.id===id;});if(!t)return;
var flow={待处理:'处理中',处理中:'已解决',已解决:'已关闭'};
if(flow[t.status]){
var next=flow[t.status];
t.status=next;
if(next==='已解决'){t.comments.push({author:CUR.n,text:'工单已解决，请确认处理结果',time:new Date().toISOString().slice(0,10)});}
if(next==='已关闭'){t.comments.push({author:CUR.n,text:'工单已关闭，感谢反馈',time:new Date().toISOString().slice(0,10)});}
toast('工单 '+id+' 已流转为「'+next+'」','su');refreshTicketList();
}else{toast('该工单已完成闭环，无需再流转','in');}
}

function saveTicket(){
var title=document.getElementById('nkTitle').value.trim();
if(!title){toast('请输入工单标题','er');return;}
var reporter=document.getElementById('nkReporter').value.trim()||CUR.n;
var nid='TK'+(1000+DTickets.length+1);
DTickets.unshift({
id:nid,title:title,cat:document.getElementById('nkCat').value,
prio:document.getElementById('nkPrio').value,status:'待处理',
reporter:reporter,assignee:document.getElementById('nkAssignee').value,
createTime:new Date().toISOString().slice(0,10),sla:'24h',usedTime:'0h',
desc:document.getElementById('nkDesc').value.trim()||'无详细描述',
comments:[{author:CUR.n,text:'工单已创建，等待处理',time:new Date().toISOString().slice(0,10)}]
});
toast('工单 '+nid+' 创建成功','su');
navTo('ticket-center','tk-list');
}
function renderTicketStats(ca){

var resolved=DTickets.filter(function(x){return x.status==='已解决'||x.status==='已关闭';}).length;

ca.innerHTML='<h3>工单统计</h3>'+

function getSLAs(){
var d=[{id:1,name:'紧急故障（高优先级）',level:'高',target:'4小时响应 / 24小时解决',reach:92,overtime:3},{id:2,name:'一般故障（中优先级）',level:'中',target:'8小时响应 / 48小时解决',reach:85,overtime:7},{id:3,name:'普通咨询（低优先级）',level:'低',target:'24小时响应 / 72小时解决',reach:78,overtime:11}];
try{var s=localStorage.getItem('tx_slas');if(s){var o=JSON.parse(s);if(Array.isArray(o)&&o.length)return o;}}catch(e){}
return d;
}
function saveSLAs(a){try{localStorage.setItem('tx_slas',JSON.stringify(a));}catch(e){}}
function slaCreate(){
var body='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
'<div style="grid-column:1/-1"><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">SLA 名称</label><input id="slaName" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px" placeholder="如: 紧急故障（高优先级）"></div>'+
'<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">优先级</label><select id="slaLevel" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"><option>高</option><option>中</option><option>低</option></select></div>'+
'<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">响应/解决目标</label><input id="slaTarget" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px" placeholder="如: 4小时响应 / 24小时解决"></div>'+
'</div>';
openModal('➕ 新建 SLA 规则',body,'<button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="slaSave()">保存规则</button>');
}
function slaSave(){
var nm=document.getElementById('slaName').value.trim();if(!nm){toast('请填写 SLA 名称','er');return;}
var a=getSLAs();var id=a.length?Math.max.apply(null,a.map(function(x){return x.id;}))+1:1;
a.push({id:id,name:nm,level:document.getElementById('slaLevel').value,target:document.getElementById('slaTarget').value.trim()||'24小时响应 / 72小时解决',reach:100,overtime:0});
saveSLAs(a);closeModal();toast('SLA 规则已创建','su');renderTicketSLA(document.getElementById('ca'));
}
function slaEdit(id){
var a=getSLAs();var o=null;for(var i=0;i<a.length;i++)if(a[i].id===id)o=a[i];
if(!o)return;
var body='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
'<div style="grid-column:1/-1"><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">SLA 名称</label><input id="slaName" value="'+o.name+'" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></div>'+
'<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">优先级</label><select id="slaLevel" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"><option'+(o.level==='高'?' selected':'')+'>高</option><option'+(o.level==='中'?' selected':'')+'>中</option><option'+(o.level==='低'?' selected':'')+'>低</option></select></div>'+
'<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">响应/解决目标</label><input id="slaTarget" value="'+o.target+'" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></div>'+
'</div>';
openModal('✏️ 编辑 SLA 规则',body,'<button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="slaUpdate('+id+')">保存修改</button>');
}
function slaUpdate(id){
var nm=document.getElementById('slaName').value.trim();if(!nm){toast('请填写 SLA 名称','er');return;}
var a=getSLAs();
for(var i=0;i<a.length;i++)if(a[i].id===id){a[i].name=nm;a[i].level=document.getElementById('slaLevel').value;a[i].target=document.getElementById('slaTarget').value.trim();}
saveSLAs(a);closeModal();toast('SLA 规则已更新','su');renderTicketSLA(document.getElementById('ca'));
}
function slaDel(id){
var a=getSLAs().filter(function(x){return x.id!==id;});
saveSLAs(a);toast('SLA 规则已删除','da');renderTicketSLA(document.getElementById('ca'));
}
function renderTicketSLA(ca){

ca.innerHTML='<h3>SLA 时效管理</h3>'+
'<div class="cd"><div class="cdh"><span class="cdt">⏱ SLA 服务级别协议</span><button class="btn btn-p btn-sm" onclick="slaCreate()">+ 新建规则</button></div>'+

'</tbody></table></div></div>';
}

// ===== TTS AUDIO PLAYBACK (话术试听-真实发声) =====
function txSpeak(text,voiceName,rate,pitch){
if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音合成','er');return;}
window.speechSynthesis.cancel();
var u=new SpeechSynthesisUtterance(text);
u.lang='zh-CN';
u.rate=(rate===undefined?1:rate);
u.pitch=(pitch===undefined?1:pitch);
// 主动选择一个中文语音（优先本地离线语音，确保一定出声）
var vs=window.speechSynthesis.getVoices();
var pick=null;
if(voiceName && vs.length){pick=vs.find(function(v){return v.name.indexOf(voiceName)>=0;});}
if(!pick && vs.length){
  var local=vs.filter(function(v){return v.localService && v.lang && v.lang.toLowerCase().indexOf('zh')>=0;});
  var online=vs.filter(function(v){return v.lang && v.lang.toLowerCase().indexOf('zh')>=0;});
  pick=(local.length?local:online)[0];
}
if(pick){u.voice=pick;}
window.speechSynthesis.speak(u);
toast('▶ 正在试听：'+text.substring(0,12)+'…','in');
}

function _findDialog(id){var r=null;CDialog.forEach(function(d){if(d.id===id)r=d;});return r;}
function recPlayDialog(id){
var d=_findDialog(id);if(!d)return;
if(!('speechSynthesis' in window)){toast('浏览器不支持语音','er');return;}
window.speechSynthesis.cancel();
var vs=window.speechSynthesis.getVoices();
var V={huihui:vs.find(function(v){return v.name.indexOf('Huihui')>=0;}),kangkang:vs.find(function(v){return v.name.indexOf('Kangkang')>=0;}),yaoyao:vs.find(function(v){return v.name.indexOf('Yaoyao')>=0;})};
var idx=0;
function speakNext(){
if(idx>=d.dialog.length){toast('▶ 对话播放完毕','in');return;}
var seg=d.dialog[idx];idx++;
var u=new SpeechSynthesisUtterance(seg.txt);
u.lang='zh-CN';
var pick=null;
if(seg.sp==='bot'){pick=V.huihui;u.pitch=1.15;u.rate=1.05;}
else if(seg.sp==='transfer'){pick=null;u.pitch=1;u.rate=1;}
else if(seg.sp==='human'){
  // 人工坐席音色（中性偏专业）
  pick=V.yaoyao||V.huihui;u.pitch=1.0;u.rate=0.95;
}
else if(seg.sp==='cust'){
  // 客户按年龄/性别选音色
  var cv=d.custVoice||'中年男';
  if(cv.indexOf('老年')>=0){ pick=(cv.indexOf('女')>=0)?V.yaoyao:V.kangkang; u.pitch=(cv.indexOf('女')>=0)?0.75:0.6; u.rate=0.82; }
  else if(cv.indexOf('青年')>=0){ pick=(cv.indexOf('女')>=0)?V.yaoyao:V.kangkang; u.pitch=(cv.indexOf('女')>=0)?1.35:1.1; u.rate=1.15; }
  else { pick=(cv.indexOf('女')>=0)?V.yaoyao:V.kangkang; u.pitch=(cv.indexOf('女')>=0)?1.05:0.9; u.rate=0.98; }
}
if(!pick){var local=vs.filter(function(v){return v.localService&&v.lang&&v.lang.toLowerCase().indexOf('zh')>=0;});pick=local[0]||vs[0];}
if(pick)u.voice=pick;
u.onend=speakNext;
window.speechSynthesis.speak(u);
}
speakNext();
}

function renderRecorder(ca){

'<div style="text-align:center;padding:20px">'+
'<div id="recStatus" style="font-size:14px;font-weight:600;margin-bottom:14px">● 待录音</div>'+
'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+

'<button class="btn btn-o" id="recPlayBtn" onclick="recPlayback()" disabled>▶ 回放录音</button>'+
'</div>'+
'<div id="recTimer" style="font-size:22px;font-weight:700;color:#5E6AD2;margin-top:14px">00:00</div>'+
'</div></div>';
window._recAudioUrl=null;
}
function recStart(){
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('当前浏览器不支持录音','er');return;}
navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
_recStream=stream;
if(window.MediaRecorder){
_recorder=new MediaRecorder(stream);_recChunks=[];
_recorder.ondataavailable=function(e){_recChunks.push(e.data);};
_recorder.onstop=function(){var blob=new Blob(_recChunks,{type:_recorder.mimeType||'audio/webm'});window._recAudioUrl=URL.createObjectURL(blob);var pb=document.getElementById('recPlayBtn');if(pb)pb.disabled=false;var st=document.getElementById('recStatus');if(st){st.textContent='● 录音完成';st.style.color='#10b981';}};
_recorder.start();
toast('开始录音','su');
}else{toast('浏览器不支持 MediaRecorder','er');}
}).catch(function(e){toast('无法访问麦克风：'+(e.message||'权限被拒绝'),'er');});
var st=document.getElementById('recStatus');if(st){st.textContent='● 正在录音…';st.style.color='#ef4444';}
document.getElementById('recStartBtn').disabled=true;
document.getElementById('recStopBtn').disabled=false;
recTimerStart();
}
function recStop(){
if(_recorder&&_recorder.state!=='inactive'){_recorder.stop();}
if(_recStream){_recStream.getTracks().forEach(function(tr){tr.stop();});}
document.getElementById('recStartBtn').disabled=false;
document.getElementById('recStopBtn').disabled=true;
recTimerStop();
toast('录音已停止','in');
}
function recPlayback(){if(window._recAudioUrl){var a=new Audio(window._recAudioUrl);a.play().then(function(){toast('▶ 正在回放录音','in');}).catch(function(){toast('回放失败','er');});}}
var _recTimerId=null,_recSec=0;
function recTimerStart(){_recSec=0;document.getElementById('recTimer').textContent='00:00';_recTimerId=setInterval(function(){_recSec++;var m=Math.floor(_recSec/60);var s=_recSec%60;document.getElementById('recTimer').textContent=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s);},1000);}
function recTimerStop(){if(_recTimerId){clearInterval(_recTimerId);_recTimerId=null;}}

function matchAIKeyword(text){
  var rules=getAIRules();
  var hit=null;
  for(var i=0;i<rules.length;i++){
    var r=rules[i];
    for(var j=0;j<r.words.length;j++){
      if(text.indexOf(r.words[j])>=0){ if(!hit||r.prio<hit.prio){hit=r;} break; }
    }
  }
  return hit;
}

  var w=document.getElementById('arWords').value.trim();
  if(!n||!w){toast('名称和触发词必填','er');return;}
  var rules=getAIRules();
  var id=rules.length?Math.max.apply(null,rules.map(function(r){return r.id;}))+1:1;
  rules.push({id:id,kw:n,words:w.split(/[\/\/\s]+/).filter(Boolean),action:document.getElementById('arAction').value,target:document.getElementById('arTarget').value.trim(),prio:0});
  saveAIRules(rules);
  closeModal();
  aiRenderRules();
  toast('触发词规则已保存','su');
}
function aiDelRule(id){

}

function aiSimCall(){

  if(!text){toast('请输入客户说的话','er');return;}
  var box=document.getElementById('aiChatBox');
  var hit=matchAIKeyword(text);
  var t=new Date();
  var time=(t.getMonth()+1)+'/'+t.getDate()+' '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
  // AI 应答
  var aiReply='';
  if(!hit){ aiReply='您好，请问有什么可以帮您？'; }
  else if(hit.action==='AI解答'){ aiReply='好的，这个问题我可以为您解答，请稍等～'; }
  else if(hit.action==='转人工'){ aiReply='好的，我马上为您转接人工坐席，请稍候。'; }
  else if(hit.action==='生成工单'){ aiReply='收到，我这就为您登记并安排处理，请保持电话畅通。'; }
  else { aiReply='好的，感谢您的来电，再见！'; }
  box.innerHTML+='<div style="margin-bottom:6px"><span style="color:#64748b">📞 客户['+time+']：</span><b>'+text+'</b></div>';
  box.innerHTML+='<div style="margin-bottom:6px"><span style="color:#2563eb">🤖 AI：</span>'+aiReply+(hit&&hit.action==='转人工'?'<span style="margin-left:8px"><button class="btn btn-sm btn-o" onclick="txPlayVoice(\'audio/transfer.mp3\')">🔊 试听真人语音</button></span>':'')+'</div>';
  try{var vf='audio/';if(!hit||hit.action==='AI解答'){txPlayVoice(vf+'answer.mp3');}else if(hit.action==='转人工'){txPlayVoice(vf+'transfer.mp3');}else if(hit.action==='生成工单'){txPlayVoice(vf+'repair.mp3');}else{txPlayVoice(vf+'end.mp3');}}catch(e){}
  // 记录
  var rec={time:time,text:text,result:hit?'转人工':'AI应答',kw:hit?hit.kw:'',target:hit?hit.target:'',status:'待处理',ticket:null,scene:document.getElementById('aiInput').placeholder||''};
  var calls=getAICalls();
  if(hit&&(hit.action==='转人工'||hit.action==='生成工单')){rec.result=hit.action;rec.kw=hit.kw;rec.target=hit.target;
    if(hit.action==='生成工单'){rec.ticket='TK'+String(2001+calls.length);rec.status='待派工';}
  }else{rec.result='AI应答';rec.status='已完成';}
  calls.unshift(rec);
  saveAICalls(calls);
  if(hit&&(hit.action==='转人工'||hit.action==='生成工单')){
    box.innerHTML+='<div style="margin:6px 0;padding:6px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px">🔔 <b>命中触发词【'+hit.kw+'】→ '+hit.action+'（'+hit.target+'）</b></div>';
  }
  box.scrollTop=box.scrollHeight;
  aiRenderTrans();
  aiRenderCallLog();
  inp.value='';
}

function aiHandle(time,st){
  var calls=getAICalls();
  for(var i=0;i<calls.length;i++){if(calls[i].time===time){calls[i].status=st;break;}}
  saveAICalls(calls);
  aiRenderTrans();
  aiRenderCallLog();
  toast('已接单处理','su');
}

function doImportNums(){
  var raw=document.getElementById('impNums').value;
  var lines=raw.split(/[\r\n,;，；]+/).map(function(s){return s.replace(/[^\d]/g,'').trim();}).filter(function(s){return s.length>=7&&s.length<=12;});
  if(!lines.length){toast('未识别到有效号码','er');return;}
  var start=DNums.length?Math.max.apply(null,DNums.map(function(n){return n.id;}))+1:1;
  var cities=['北京','上海','广州','深圳','杭州','成都','武汉','南京','西安','重庆','济南'];
  var tags=['导入'];
  lines.forEach(function(num,i){
    DNums.push({id:start+i,num:num,city:cities[Math.floor(Math.random()*cities.length)],status:'待呼叫',tag:'新导入',source:'导入',callTimes:0,lastCall:'-'});
  });
  setStored('tx_nums',DNums);
  closeModal();
  toast('成功导入 '+lines.length+' 个号码','su');
  if(typeof refreshNumTable==='function')refreshNumTable();
  if(typeof renderPhoneList==='function')renderPhoneList(document.getElementById('ca'));
}

function kbDocsHtml(id,q){
  var kbs=getKBs();var kb=null;for(var i=0;i<kbs.length;i++){if(kbs[i].id===id){kb=kbs[i];break;}}
  var docs=(kb&&kb.docsArr)?kb.docsArr:[];
  var f=docs.filter(function(d){return !q||d.t.indexOf(q)>=0||d.a.indexOf(q)>=0;});
  if(!f.length)return '<div style="color:var(--tm);padding:12px 0">暂无匹配文档</div>';
  return f.map(function(d){return '<div style="padding:8px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px"><div style="font-weight:600">'+d.t+'</div><div style="color:var(--tm);font-size:12px">'+d.a+'</div></div>';}).join('');
}

  var md=document.getElementById('md');

  '<div style="margin-bottom:10px"><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">标题</label><input id="kdTitle" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></div>'+
  '<div style="margin-bottom:12px"><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">内容（AI检索用）</label><textarea id="kdAns" rows="5" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></textarea></div>'+
  '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="kbSaveDoc('+id+')">保存</button></div>';
  document.getElementById('mo').style.display='flex';
}
function kbSaveDoc(id){
  var t=document.getElementById('kdTitle').value.trim();
  var a=document.getElementById('kdAns').value.trim();
  if(!t||!a){toast('标题和内容必填','er');return;}
  var kbs=getKBs();
  for(var i=0;i<kbs.length;i++){if(kbs[i].id===id){if(!kbs[i].docsArr)kbs[i].docsArr=[];kbs[i].docsArr.push({t:t,a:a});kbs[i].docs++;kbs[i].update='2026-08-23';break;}}
  saveKBs(kbs);
  closeModal();
  toast('文档已添加','su');
  kbBrowse(id);
}
function kbSync(id){
  var kbs=getKBs();
  for(var i=0;i<kbs.length;i++){if(kbs[i].id===id){kbs[i].update='2026-08-23';break;}}
  saveKBs(kbs);
  toast('已同步到最新版本','su');
  renderKnowledgeCenter(document.getElementById('ca'));
}

  var md=document.getElementById('md');
  md.innerHTML='<div class="mdh" style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:12px"><span style="font-weight:600;font-size:15px">➕ 新建线索</span><button onclick="closeModal()" style="border:none;background:none;font-size:18px;cursor:pointer;color:var(--tm)">×</button></div>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
  '<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">客户名称</label><input id="ldName" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></div>'+
  '<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">公司名称</label><input id="ldComp" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></div>'+

  '<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">预算(元)</label><input id="ldBudget" type="number" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px" placeholder="50000"></div>'+
  '<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">阶段</label><select id="ldStage" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"><option>初步接触</option><option>需求确认</option><option>方案报价</option><option>商务谈判</option><option>签约</option></select></div>'+
  '<div><label style="display:block;font-size:12px;color:var(--tm);margin-bottom:4px">意向</label><select id="ldIntent" style="width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;font-size:13px"><option>高</option><option>中</option><option>低</option><option>极高</option></select></div>'+
  '</div>'+
  '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btn-o" onclick="closeModal()">取消</button><button class="btn btn-p" onclick="leadSave()">保存线索</button></div>';
  document.getElementById('mo').style.display='flex';
}
function leadSave(){
  var nm=document.getElementById('ldName').value.trim();
  var cp=document.getElementById('ldComp').value.trim();
  var ph=document.getElementById('ldPhone').value.trim();
  if(!nm||!cp){toast('请填写客户和公司名称','er');return;}
  var id=DLeads.length?Math.max.apply(null,DLeads.map(function(l){return l.id;}))+1:1;
  var srcs=['手动添加','转介绍','电销','官网注册'];
  var owners=['张明','李娟','王磊','赵丽','陈晨'];
  DLeads.push({id:id,customer:nm,company:cp,phone:ph||'13800138000',stage:document.getElementById('ldStage').value,source:srcs[Math.floor(Math.random()*srcs.length)],owner:owners[Math.floor(Math.random()*owners.length)],intent:document.getElementById('ldIntent').value,budget:parseInt(document.getElementById('ldBudget').value)||10000,time:'2026-08-24'});
  try{localStorage.setItem('tx_leads',JSON.stringify(DLeads));}catch(e){}
  closeModal();
  toast('线索已创建','su');
  renderLeadList(document.getElementById('ca'));
}
